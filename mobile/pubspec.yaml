name: fomode
description: Anti-procrastination app that helps you stay focused
publish_to: "none" # We're not publishing this to pub.dev

version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI Components
  cupertino_icons: ^1.0.2
  hugeicons: ^0.0.7

  # State Management
  # Provider is simpler than Riverpod for beginners
  # It manages app state (goals, focus sessions, etc.)
  provider: ^6.1.1

  # Networking
  # http: Basic HTTP client
  http: ^1.1.0
  # dio: More powerful HTTP client with interceptors, error handling
  dio: ^5.4.0

  # Local Storage
  # Saves user preferences, cache data locally
  shared_preferences: ^2.2.2
  # Secure storage for JWT tokens
  flutter_secure_storage: ^9.0.0

  # Authentication
  # Google Sign-In
  google_sign_in: ^6.2.1
  # Apple Sign-In (iOS only)
  sign_in_with_apple: ^6.1.0

  # Date/Time Utilities
  # Formats dates nicely (e.g., "Nov 14, 2025")
  intl: ^0.20.2

  # UI Enhancements
  # Slidable list items (swipe to delete)
  flutter_slidable: ^4.0.3
  # Progress indicators (circular, linear)
  percent_indicator: ^4.2.3
  # Beautiful charts
  fl_chart: ^0.69.0
  # SVG rendering for brand icons
  flutter_svg: ^2.0.10

  # Notifications
  # Local push notifications for focus reminders
  flutter_local_notifications: ^18.0.1

  # Platform-specific features (we'll add these later when needed)
  # app_usage: ^2.0.0        # Monitor app usage (Android only)
  # device_apps: ^2.2.0      # Get installed apps (Android)

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting rules for clean code
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/

